name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconfirm --clean --windowed --onedir --name RivalsAssist --collect-all dxcam --collect-all mss --collect-all cv2 app.py
      - uses: actions/upload-artifact@v4
        with:
          name: RivalsAssist
          path: dist/RivalsAssist
